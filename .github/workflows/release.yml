name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build verified runtime package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version "${{ github.ref_name }}"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CS2PerformancePatcher.bat
            Instalar-Mod.bat
            artifacts/release/CS2PerformancePatcher.zip
            artifacts/release/CS2PerformancePatcher.zip.sha256
